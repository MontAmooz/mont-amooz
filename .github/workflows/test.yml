name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # Required at module load of src/lib/server/auth.ts (see ADR-0004)
      AUTH_SECRET: "ci-test-secret-32-bytes-minimum-length"
    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules (issue #4 workaround — see ADR-0010)
        uses: actions/cache@v4
        id: nmcache
        with:
          path: |
            node_modules
            mini-services/classroom-service/node_modules
          key: node-modules-${{ hashFiles('bun.lock') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23" # pin: 1.4.4 hangs at install from runners (P4); revisit upstream

      - name: Install dependencies (cache miss only)
        if: steps.nmcache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile --ignore-scripts --network-concurrency 16

      - name: Install classroom-service deps (cache miss only)
        if: steps.nmcache.outputs.cache-hit != 'true'
        working-directory: mini-services/classroom-service
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        if: steps.nmcache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        env:
          PRISMA_ENGINES_MIRROR: https://registry.npmmirror.com/-/binary/prisma
        run: bunx prisma generate

      - name: Run tests (unit + auth integration)
        run: bun run test
