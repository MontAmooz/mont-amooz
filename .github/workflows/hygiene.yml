name: Hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the script audits every commit on all refs

      - name: Contributor identity check (full history)
        run: bash scripts/check-contributors.sh
