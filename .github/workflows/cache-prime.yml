name: Cache Prime (manual)

on:
  workflow_dispatch:

# One-time (and after each bun.lock change) node_modules builder for issue #4:
# runner egress to package CDNs is degraded, so lifecycle scripts hang forever.
# Strategy: registry-only install (--ignore-scripts — sharp/esbuild ship binaries
# as platform tarballs), prisma engines via npmmirror, everything cached so
# normal CI runs never touch the network.
jobs:
  prime:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            node_modules
            mini-services/classroom-service/node_modules
          key: node-modules-${{ hashFiles('bun.lock') }}

      - name: Install (registry only, no lifecycle scripts)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile --ignore-scripts --network-concurrency 16

      - name: Generate Prisma client (engines via npmmirror)
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        env:
          PRISMA_ENGINES_MIRROR: https://registry.npmmirror.com/-/binary/prisma
        run: bunx prisma generate

      - name: Install classroom-service deps
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: mini-services/classroom-service
        run: bun install --frozen-lockfile --network-concurrency 16
