name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23" # pin: 1.4.4 hangs at install from runners (P4); revisit upstream

      # Issue #4 workaround (ADR-0010): runner egress to package registries is
      # dead (>60min for downloads-only), so node_modules ships as a release
      # asset (built on linux-x64 glibc; includes the generated Prisma client).
      # Refresh: rebuild locally + replace the v0.3.0-deps asset after any
      # bun.lock change.
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # OpenSSL 3 — Prisma runtime detection must match the
                           # debian-openssl-3.0.x engine shipped in the artifact
                           # (runner default node reports openssl 1.1 → engine
                           # not found → every DB query 500s; issue #4)
      - name: Restore node_modules from release artifact
        run: |
          gh release download v0.3.0-deps --repo OpenEduGit/open-edu-git \
            --pattern "node_modules-ci.tgz" --output /tmp/deps.tgz
          tar xzf /tmp/deps.tgz
          rm /tmp/deps.tgz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
