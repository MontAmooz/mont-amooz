name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    # 10min proved too tight for a cold-runner bun install (P4 PR #3 timed out
    # mid-install); 20min matches the test job and the cache makes it moot.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules (issue #4 workaround — see ADR-0010)
        uses: actions/cache@v4
        id: nmcache
        with:
          path: |
            node_modules
            mini-services/classroom-service/node_modules
          key: node-modules-${{ hashFiles('bun.lock') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23" # pin: 1.4.4 hangs at install from runners (P4); revisit upstream

      # single long attempt (see note in test.yml)
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts --network-concurrency 16

      - name: Install classroom-service dependencies
        working-directory: mini-services/classroom-service
        run: bun install --frozen-lockfile --ignore-scripts --network-concurrency 16

      - name: Generate Prisma client
        if: steps.nmcache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        env:
          PRISMA_ENGINES_MIRROR: https://registry.npmmirror.com/-/binary/prisma
        run: bunx prisma generate

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
